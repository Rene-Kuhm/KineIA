name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://kineia_app_ci:kineia_app_ci_password@localhost:5432/kineia_test
      TEST_DATABASE_URL: postgresql+asyncpg://kineia_app_ci:kineia_app_ci_password@localhost:5432/kineia_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_bootstrap
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and development dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Create least-privilege PostgreSQL database owner
        working-directory: backend
        env:
          BOOTSTRAP_DATABASE_URL: postgresql://postgres:postgres_ci_bootstrap@localhost:5432/postgres
        run: |
          python - <<'PY'
          import os

          import psycopg2
          from psycopg2 import sql

          role = "kineia_app_ci"
          database = "kineia_test"
          connection = psycopg2.connect(os.environ["BOOTSTRAP_DATABASE_URL"])
          connection.autocommit = True
          with connection.cursor() as cursor:
              cursor.execute(
                  sql.SQL(
                      "CREATE ROLE {} LOGIN PASSWORD %s "
                      "NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"
                  ).format(sql.Identifier(role)),
                  ("kineia_app_ci_password",),
              )
              cursor.execute(
                  sql.SQL("CREATE DATABASE {} OWNER {}").format(
                      sql.Identifier(database), sql.Identifier(role)
                  )
              )
          connection.close()

          with psycopg2.connect(os.environ["DATABASE_URL"]) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      "SELECT r.rolsuper, r.rolcreatedb, r.rolcreaterole, "
                      "r.rolreplication, r.rolbypassrls, d.datdba = r.oid "
                      "FROM pg_roles r JOIN pg_database d "
                      "ON d.datname = current_database() WHERE r.rolname = current_user"
                  )
                  assert cursor.fetchone() == (False, False, False, False, False, True)
          PY

      - name: Smoke test PostgreSQL migrations
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Run evaluator tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Compile Python sources
        run: python -m compileall -q backend/app backend/tests scripts

      - name: Find changed Python files
        id: changed-python
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi

          changed_files="$RUNNER_TEMP/changed-python-files"
          if ! git diff --name-only -z --diff-filter=ACMR \
            "$base" "$GITHUB_SHA" -- "*.py" > "$changed_files"; then
            echo "::error::Unable to determine changed Python files"
            exit 1
          fi

          if [[ -s "$changed_files" ]]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint changed Python files
        if: steps.changed-python.outputs.has_files == 'true'
        shell: bash
        run: |
          mapfile -d '' -t files < "$RUNNER_TEMP/changed-python-files"
          python -m ruff check --config backend/pyproject.toml -- "${files[@]}"
