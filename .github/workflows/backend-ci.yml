name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and development dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Run evaluator tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Compile Python sources
        run: python -m compileall -q backend/app backend/tests scripts

      - name: Find changed Python files
        id: changed-python
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi

          changed_files="$RUNNER_TEMP/changed-python-files"
          if ! git diff --name-only -z --diff-filter=ACMR \
            "$base" "$GITHUB_SHA" -- "*.py" > "$changed_files"; then
            echo "::error::Unable to determine changed Python files"
            exit 1
          fi

          if [[ -s "$changed_files" ]]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint changed Python files
        if: steps.changed-python.outputs.has_files == 'true'
        shell: bash
        run: |
          mapfile -d '' -t files < "$RUNNER_TEMP/changed-python-files"
          python -m ruff check --config backend/pyproject.toml -- "${files[@]}"
